@if (open) {
  <div class="drawer-backdrop" (click)="close()"></div>
  <aside class="drawer" role="dialog" aria-modal="true" [attr.aria-label]="title">
    <header class="drawer__header">
      <h2>{{ title }}</h2>
      <button type="button" class="btn-icon" (click)="close()" aria-label="Cerrar">
        <mat-icon>close</mat-icon>
      </button>
    </header>
    <div class="drawer__body"><ng-content /></div>
    <footer class="drawer__footer"><ng-content select="[drawer-footer]" /></footer>
  </aside>
}
